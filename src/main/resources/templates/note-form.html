<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div th:fragment="note-form" class="modal-overlay">
    
        <div class="note-form-container">
            
            <div class="modal-content">
                <form hx-post="/save" hx-target="#notes-list-container">
                    <div class="note-row back-container">
                        <a type="button" hx-get="/clear-modal" hx-target="#modals-here">back</a>
                    </div>
                    
                    <input type="hidden" name="id" th:if="${note?.id != null}" th:value="${note.id}">

                    <div class="note-row">
                        <input id="title-input" type="text" name="title" th:value="${note?.title}" placeholder="Add a title..." required>
                    </div>
                    
                    <div class="note-row">
                        <label>Due Date</label>
                        <input type="date" required name="date" th:value="${note?.date}">
                    </div>

                    <div class="note-row">
                        <label>Description</label>
                        <textarea class="note-desc-input" name="description" th:text="${note?.description}"></textarea>
                    </div>

                    <div class="note-row">
                        <button class="submit-bttn" type="submit">Save Note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
